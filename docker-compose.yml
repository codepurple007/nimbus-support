# Production-shaped data store. Not required for RETRIEVAL_BACKEND=tfidf.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbus
    ports:
      - "5432:5432"
    volumes:
      - nimbus_pg:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  nimbus_pg:
