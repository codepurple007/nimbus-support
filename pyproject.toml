[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus-support"
version = "0.2.0"
description = "LangGraph customer-support agent for Nimbus — retrieve-first, cited answers."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "typer>=0.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "pypdf>=5.0.0",
    "langfuse>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
nimbus = "nimbus_support.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nimbus_support = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
